<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="780" fill="#f8fafc" rx="16" />

  <!-- Title -->
  <g transform="translate(50, 35)">
    <rect width="180" height="26" rx="13" fill="#eff6ff" />
    <text x="90" y="17" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">UML SEQUENCE DIAGRAM</text>
    <text x="0" y="55" fill="#0f172a" font-size="22" font-weight="700">Sơ Đồ Tuần Tự Luồng Báo Cáo &amp; Xử Lý Sự Cố</text>
    <text x="0" y="76" fill="#64748b" font-size="13">Tương tác giữa Khách thuê, API Server, Database, Web Push và Chủ nhà</text>
  </g>

  <!-- PARTICIPANTS HEADERS -->
  <!-- 1. Tenant (Khách) -->
  <g transform="translate(80, 110)">
    <rect width="130" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="65" y="24" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">👤 Khách thuê</text>
    <text x="65" y="40" fill="#64748b" font-size="10" text-anchor="middle">Mobile Web / PWA</text>
    <!-- Lifeline -->
    <line x1="65" y1="50" x2="65" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6" />
  </g>

  <!-- 2. Portal Frontend -->
  <g transform="translate(250, 110)">
    <rect width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="65" y="24" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">💻 Portal Client</text>
    <text x="65" y="40" fill="#64748b" font-size="10" text-anchor="middle">React 19 / TanStack</text>
    <line x1="65" y1="50" x2="65" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6" />
  </g>

  <!-- 3. Backend API -->
  <g transform="translate(430, 110)">
    <rect width="140" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2" />
    <text x="70" y="24" fill="#854d0e" font-size="12" font-weight="700" text-anchor="middle">⚙️ Backend Server</text>
    <text x="70" y="40" fill="#a16207" font-size="10" text-anchor="middle">Express 5 / Middleware</text>
    <line x1="70" y1="50" x2="70" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6" />
  </g>

  <!-- 4. Database -->
  <g transform="translate(620, 110)">
    <rect width="130" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
    <text x="65" y="24" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">🗄️ PostgreSQL</text>
    <text x="65" y="40" fill="#15803d" font-size="10" text-anchor="middle">Neon (Prisma ORM)</text>
    <line x1="65" y1="50" x2="65" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6" />
  </g>

  <!-- 5. Landlord (Chủ) -->
  <g transform="translate(800, 110)">
    <rect width="130" height="50" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2" />
    <text x="65" y="24" fill="#6b21a8" font-size="12" font-weight="700" text-anchor="middle">👨‍💼 Chủ nhà</text>
    <text x="65" y="40" fill="#7e22ce" font-size="10" text-anchor="middle">Desktop Dashboard</text>
    <line x1="65" y1="50" x2="65" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6" />
  </g>

  <!-- SEQUENCE STEPS -->

  <!-- STEP 1: Khách điền form và gửi -->
  <g transform="translate(0, 180)">
    <!-- Activation bar on Client -->
    <rect x="310" y="10" width="10" height="150" fill="#93c5fd" />
    <line x1="145" y1="15" x2="310" y2="15" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)" />
    <text x="225" y="9" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">1. Điền form &amp; đính kèm ảnh</text>

    <!-- Client POST to Backend -->
    <rect x="495" y="25" width="10" height="120" fill="#fde047" />
    <line x1="320" y1="35" x2="495" y2="35" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)" />
    <text x="405" y="28" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle" class="code">POST /api/portal/maintenance</text>

    <!-- Backend insert DB -->
    <rect x="680" y="45" width="10" height="50" fill="#86efac" />
    <line x1="505" y1="55" x2="680" y2="55" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)" />
    <text x="590" y="49" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Prisma: create(MaintenanceRequest)</text>

    <!-- DB return OK -->
    <line x1="680" y1="85" x2="505" y2="85" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr-dash)" />
    <text x="590" y="80" fill="#64748b" font-size="9.5" text-anchor="middle">Trả về ID + status=OPEN</text>

    <!-- Backend notifies Landlord (Socket/Push) -->
    <line x1="505" y1="115" x2="860" y2="115" stroke="#9333ea" stroke-width="2" marker-end="url(#arr)" />
    <text x="680" y="108" fill="#6b21a8" font-size="10.5" font-weight="700" text-anchor="middle">🔔 Bắn chuông thông báo có sự cố mới!</text>

    <!-- Backend response to Client -->
    <line x1="495" y1="135" x2="320" y2="135" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr-dash)" />
    <text x="405" y="130" fill="#15803d" font-size="9.5" text-anchor="middle">HTTP 201 Created</text>

    <line x1="310" y1="155" x2="145" y2="155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr-dash)" />
    <text x="225" y="150" fill="#15803d" font-size="9.5" text-anchor="middle">Hiển thị "Gửi thành công! Đang chờ duyệt"</text>
  </g>

  <!-- DIVIDER: PHASE 2 CHỦ NHÀ XỬ LÝ -->
  <g transform="translate(80, 360)">
    <rect width="850" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" />
    <text x="425" y="16" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">GIAI ĐOẠN 2: CHỦ NHÀ TIẾP NHẬN &amp; ĐIỀU PHỐI THỢ SỬA</text>
  </g>

  <!-- STEP 2: Chủ nhà cập nhật trạng thái -->
  <g transform="translate(0, 400)">
    <!-- Landlord clicks Update -->
    <rect x="860" y="10" width="10" height="120" fill="#d8b4fe" />
    <line x1="860" y1="20" x2="505" y2="20" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)" />
    <text x="680" y="14" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle" class="code">PATCH /api/maintenance/:id { status: "IN_PROGRESS" }</text>

    <!-- Backend updates DB -->
    <rect x="495" y="15" width="10" height="100" fill="#fde047" />
    <line x1="505" y1="45" x2="680" y2="45" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)" />
    <text x="590" y="38" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">Prisma: update(status, note)</text>

    <!-- DB return OK -->
    <line x1="680" y1="65" x2="505" y2="65" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr-dash)" />

    <!-- Backend Push notification to Tenant -->
    <line x1="495" y1="85" x2="145" y2="85" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)" />
    <text x="315" y="78" fill="#2563eb" font-size="10.5" font-weight="700" text-anchor="middle">📲 Web Push: "Sự cố vòi nước đang được xử lý (hẹn 14h)"</text>

    <!-- Response to Landlord -->
    <line x1="505" y1="105" x2="860" y2="105" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr-dash)" />
    <text x="680" y="100" fill="#15803d" font-size="9.5" text-anchor="middle">HTTP 200 OK (Cập nhật giao diện)</text>
  </g>

  <!-- DIVIDER: PHASE 3 HOÀN TẤT -->
  <g transform="translate(80, 545)">
    <rect width="850" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
    <text x="425" y="16" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">GIAI ĐOẠN 3: THỢ SỬA XONG &amp; ĐÓNG SỰ CỐ (DONE)</text>
  </g>

  <!-- STEP 3: Hoàn tất -->
  <g transform="translate(0, 585)">
    <line x1="860" y1="15" x2="505" y2="15" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
    <text x="680" y="9" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle" class="code">PATCH /api/maintenance/:id { status: "DONE", resolvedAt: now() }</text>

    <line x1="495" y1="40" x2="145" y2="40" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
    <text x="315" y="34" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">🎉 Báo Khách thuê: "Sự cố đã sửa xong, vui lòng nghiệm thu!"</text>
  </g>

  <!-- FOOTER SUMMARY NOTE -->
  <g transform="translate(50, 715)">
    <rect width="900" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <text x="20" y="26" fill="#334155" font-size="11.5">📌 <tspan font-weight="700">Điểm cốt lõi:</tspan> Toàn bộ luồng đảm bảo tính Realtime và minh bạch; cả Khách và Chủ đều nắm bắt trạng thái theo từng bước mà không cần gọi điện thoại giục nhau.</text>
  </g>
</svg>
