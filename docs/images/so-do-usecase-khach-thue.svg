<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="16" />

  <!-- Title -->
  <g transform="translate(50, 35)">
    <rect width="170" height="26" rx="13" fill="#eff6ff" />
    <text x="85" y="17" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">UML USE CASE DIAGRAM</text>
    <text x="0" y="55" fill="#0f172a" font-size="22" font-weight="700">Sơ Đồ Use Case Phân Hệ Khách Thuê (Tenant Portal)</text>
    <text x="0" y="76" fill="#64748b" font-size="13">Các chức năng cốt lõi do TV4 phụ trách giao diện và nghiệp vụ</text>
  </g>

  <!-- BOUNDARY SYSTEM BOX -->
  <rect x="230" y="110" width="530" height="540" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6" filter="url(#card-shadow)" />
  <text x="250" y="135" fill="#1e3a8a" font-size="13" font-weight="700">HỆ THỐNG CỔNG KHÁCH THUÊ (TENANT PORTAL)</text>

  <!-- ACTOR 1: KHÁCH THUÊ (LEFT) -->
  <g transform="translate(90, 330)">
    <!-- Stick Figure -->
    <circle cx="35" cy="20" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <line x1="35" y1="34" x2="35" y2="70" stroke="#2563eb" stroke-width="2.5" />
    <line x1="15" y1="48" x2="55" y2="48" stroke="#2563eb" stroke-width="2.5" />
    <line x1="35" y1="70" x2="15" y2="105" stroke="#2563eb" stroke-width="2.5" />
    <line x1="35" y1="70" x2="55" y2="105" stroke="#2563eb" stroke-width="2.5" />
    <text x="35" y="125" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Khách thuê</text>
    <text x="35" y="142" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">(TENANT)</text>
  </g>

  <!-- ACTOR 2: CỔNG VIETQR / HỆ THỐNG (RIGHT TOP) -->
  <g transform="translate(840, 240)">
    <circle cx="35" cy="20" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
    <line x1="35" y1="34" x2="35" y2="70" stroke="#16a34a" stroke-width="2.5" />
    <line x1="15" y1="48" x2="55" y2="48" stroke="#16a34a" stroke-width="2.5" />
    <line x1="35" y1="70" x2="15" y2="105" stroke="#16a34a" stroke-width="2.5" />
    <line x1="35" y1="70" x2="55" y2="105" stroke="#16a34a" stroke-width="2.5" />
    <text x="35" y="125" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Ngân hàng</text>
    <text x="35" y="142" fill="#16a34a" font-size="10.5" font-weight="600" text-anchor="middle">VietQR Webhook</text>
  </g>

  <!-- ACTOR 3: CHỦ NHÀ (RIGHT BOTTOM) -->
  <g transform="translate(840, 480)">
    <circle cx="35" cy="20" r="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5" />
    <line x1="35" y1="34" x2="35" y2="70" stroke="#9333ea" stroke-width="2.5" />
    <line x1="15" y1="48" x2="55" y2="48" stroke="#9333ea" stroke-width="2.5" />
    <line x1="35" y1="70" x2="15" y2="105" stroke="#9333ea" stroke-width="2.5" />
    <line x1="35" y1="70" x2="55" y2="105" stroke="#9333ea" stroke-width="2.5" />
    <text x="35" y="125" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Chủ nhà</text>
    <text x="35" y="142" fill="#9333ea" font-size="10.5" font-weight="600" text-anchor="middle">(LANDLORD)</text>
  </g>

  <!-- USE CASES (ELLIPSES) -->

  <!-- UC 1: Đăng nhập -->
  <g transform="translate(360, 155)">
    <ellipse cx="100" cy="22" rx="90" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" />
    <text x="100" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">UC1: Đăng nhập cổng khách</text>
  </g>

  <!-- UC 2: Xem phòng & HĐ -->
  <g transform="translate(360, 215)">
    <ellipse cx="100" cy="22" rx="95" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" />
    <text x="100" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">UC2: Xem phòng &amp; hợp đồng</text>
  </g>

  <!-- UC 3: Xem danh sách hóa đơn -->
  <g transform="translate(360, 275)">
    <ellipse cx="100" cy="22" rx="100" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" />
    <text x="100" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">UC3: Xem danh sách hóa đơn</text>
  </g>

  <!-- UC 4: Xem chi tiết & Quét VietQR -->
  <g transform="translate(360, 335)">
    <ellipse cx="100" cy="24" rx="110" ry="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="100" y="24" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">UC4: Chi tiết HĐ &amp; Quét VietQR</text>
    <text x="100" y="38" fill="#3b82f6" font-size="9.5" text-anchor="middle">Tự động gạch nợ</text>
  </g>

  <!-- UC 5: Gửi báo sự cố -->
  <g transform="translate(360, 405)">
    <ellipse cx="100" cy="24" rx="110" ry="24" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="100" y="24" fill="#b45309" font-size="12" font-weight="700" text-anchor="middle">UC5: Gửi yêu cầu sửa chữa ⭐</text>
    <text x="100" y="38" fill="#d97706" font-size="9.5" text-anchor="middle">Kèm ảnh chụp hiện trường</text>
  </g>

  <!-- UC 6: Theo dõi tiến độ sự cố -->
  <g transform="translate(360, 475)">
    <ellipse cx="100" cy="22" rx="105" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" />
    <text x="100" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">UC6: Theo dõi tiến độ sự cố</text>
  </g>

  <!-- UC 7: Nhận thông báo & Web Push -->
  <g transform="translate(360, 535)">
    <ellipse cx="100" cy="22" rx="105" ry="22" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="100" y="26" fill="#6b21a8" font-size="12" font-weight="600" text-anchor="middle">UC7: Nhận Web Push &amp; In-app</text>
  </g>

  <!-- UC 8: Cài đặt PWA -->
  <g transform="translate(360, 595)">
    <ellipse cx="100" cy="22" rx="90" ry="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" />
    <text x="100" y="26" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">UC8: Cài PWA lên điện thoại</text>
  </g>

  <!-- ASSOCIATIONS (LINES FROM TENANT TO UC) -->
  <line x1="150" y1="360" x2="360" y2="177" stroke="#64748b" stroke-width="1.5" />
  <line x1="150" y1="375" x2="360" y2="237" stroke="#64748b" stroke-width="1.5" />
  <line x1="150" y1="385" x2="360" y2="297" stroke="#64748b" stroke-width="1.5" />
  <line x1="150" y1="395" x2="350" y2="359" stroke="#2563eb" stroke-width="2" />
  <line x1="150" y1="410" x2="350" y2="429" stroke="#d97706" stroke-width="2" />
  <line x1="150" y1="420" x2="360" y2="497" stroke="#64748b" stroke-width="1.5" />
  <line x1="150" y1="435" x2="360" y2="557" stroke="#64748b" stroke-width="1.5" />
  <line x1="150" y1="450" x2="370" y2="617" stroke="#64748b" stroke-width="1.5" />

  <!-- ASSOCIATIONS TO SECONDARY ACTORS -->
  <!-- UC4 -> VietQR Webhook -->
  <line x1="570" y1="359" x2="840" y2="290" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4" />
  <text x="700" y="315" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">&lt;&lt; đối soát tự động &gt;&gt;</text>

  <!-- UC5 & UC6 -> Landlord -->
  <line x1="570" y1="429" x2="840" y2="520" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="4" />
  <text x="700" y="465" fill="#9333ea" font-size="10" font-weight="600" text-anchor="middle">&lt;&lt; tiếp nhận &amp; sửa &gt;&gt;</text>

  <!-- UC7 -> Landlord (Nhận thông báo khi chủ cập nhật) -->
  <line x1="570" y1="557" x2="840" y2="550" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="4" />

</svg>
