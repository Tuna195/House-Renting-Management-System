<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <g transform="translate(50, 35)">
    <rect width="180" height="26" rx="13" fill="#eff6ff" />
    <text x="90" y="17" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">NOTIFICATION ARCHITECTURE</text>
    <text x="0" y="55" fill="#0f172a" font-size="22" font-weight="700">Kiến Trúc Hệ Thống Thông Báo Đa Kênh (Omnichannel)</text>
    <text x="0" y="76" fill="#64748b" font-size="13">In-App Notification • PWA Web Push • Realtime Socket.IO (Phụ trách: TV4 &amp; TV1)</text>
  </g>

  <!-- COLUMN 1: SỰ KIỆN KÍCH HOẠT (TRIGGER EVENTS) -->
  <g transform="translate(50, 120)">
    <rect width="220" height="490" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="220" height="38" rx="12" fill="#f1f5f9" />
    <rect y="26" width="220" height="12" fill="#f1f5f9" />
    <text x="110" y="24" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">⚡ SỰ KIỆN KÍCH HOẠT</text>

    <!-- Event 1: Hóa đơn -->
    <g transform="translate(15, 55)">
      <rect width="190" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
      <text x="12" y="24" fill="#991b1b" font-size="11.5" font-weight="700">📄 Phát hành hóa đơn</text>
      <text x="12" y="42" fill="#7f1d1d" font-size="10">Chủ nhà chốt tiền phòng</text>
      <text x="12" y="56" fill="#b91c1c" font-size="9" class="code">status: UNPAID</text>
    </g>

    <!-- Event 2: Sự cố -->
    <g transform="translate(15, 130)">
      <rect width="190" height="65" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
      <text x="12" y="24" fill="#854d0e" font-size="11.5" font-weight="700">🛠️ Đổi trạng thái sự cố</text>
      <text x="12" y="42" fill="#a16207" font-size="10">Khách gửi / Chủ hẹn thợ</text>
      <text x="12" y="56" fill="#ca8a04" font-size="9" class="code">OPEN ➔ IN_PROGRESS ➔ DONE</text>
    </g>

    <!-- Event 3: VietQR -->
    <g transform="translate(15, 205)">
      <rect width="190" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
      <text x="12" y="24" fill="#166534" font-size="11.5" font-weight="700">💰 Webhook VietQR</text>
      <text x="12" y="42" fill="#15803d" font-size="10">Tiền về tài khoản chủ</text>
      <text x="12" y="56" fill="#16a34a" font-size="9" class="code">Auto: PAID &amp; gạch nợ</text>
    </g>

    <!-- Event 4: Cron Job -->
    <g transform="translate(15, 280)">
      <rect width="190" height="65" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
      <text x="12" y="24" fill="#1e40af" font-size="11.5" font-weight="700">⏰ Cron Job tự động</text>
      <text x="12" y="42" fill="#2563eb" font-size="10">Nhắc nợ trước 1 ngày</text>
      <text x="12" y="56" fill="#3b82f6" font-size="9" class="code">schedule: 0 8 * * *</text>
    </g>

    <!-- Event 5: Bảng tin -->
    <g transform="translate(15, 355)">
      <rect width="190" height="65" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
      <text x="12" y="24" fill="#6b21a8" font-size="11.5" font-weight="700">📢 Thông báo chung</text>
      <text x="12" y="42" fill="#7e22ce" font-size="10">Cắt điện nước, an ninh</text>
      <text x="12" y="56" fill="#9333ea" font-size="9">Gửi cả tòa nhà</text>
    </g>
  </g>

  <!-- ARROW COL 1 -> COL 2 -->
  <path d="M 270 365 L 360 365" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="315" y="355" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">Dispatch</text>

  <!-- COLUMN 2: NOTIFICATION DISPATCHER (BACKEND SERVICE) -->
  <g transform="translate(365, 250)">
    <rect width="200" height="230" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)" />
    <rect width="200" height="38" rx="14" fill="#0f172a" />
    <rect y="26" width="200" height="12" fill="#0f172a" />
    <text x="100" y="24" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">⚙️ NOTIFICATION HUB</text>
    
    <text x="16" y="65" fill="#f8fafc" font-size="11" font-weight="600">• backend/services/</text>
    <text x="24" y="82" fill="#94a3b8" font-size="10.5" class="code">notification.service.ts</text>

    <text x="16" y="112" fill="#f8fafc" font-size="11" font-weight="600">• Xử lý nghiệp vụ:</text>
    <text x="24" y="130" fill="#94a3b8" font-size="10">1. Tạo bản ghi CSDL</text>
    <text x="24" y="148" fill="#94a3b8" font-size="10">2. Lấy PushSubscription</text>
    <text x="24" y="166" fill="#94a3b8" font-size="10">3. Ký VAPID Web Push</text>
    <text x="24" y="184" fill="#94a3b8" font-size="10">4. Emit Socket.IO room</text>

    <rect x="20" y="200" width="160" height="18" rx="4" fill="#0284c7" />
    <text x="100" y="213" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Bắn đồng thời 3 kênh</text>
  </g>

  <!-- ARROWS COL 2 -> COL 3 -->
  <!-- Upper: In-App -->
  <path d="M 565 300 Q 640 210 680 190" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)" />
  <!-- Middle: Web Push -->
  <path d="M 565 365 L 680 365" stroke="#9333ea" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)" />
  <!-- Lower: Realtime -->
  <path d="M 565 430 Q 640 520 680 540" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)" />

  <!-- COLUMN 3: 3 KÊNH THÔNG BÁO (THE 3 CHANNELS) -->

  <!-- KÊNH 1: IN-APP NOTIFICATION -->
  <g transform="translate(690, 120)">
    <rect width="260" height="135" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <rect width="260" height="34" rx="12" fill="#eff6ff" />
    <rect y="22" width="260" height="12" fill="#eff6ff" />
    <text x="14" y="22" fill="#1e40af" font-size="12" font-weight="700">🔔 KÊNH 1: IN-APP (DATABASE)</text>

    <text x="14" y="54" fill="#0f172a" font-size="11">• Lưu bảng <tspan class="code" font-weight="700">Notification</tspan> trong PostgreSQL</text>
    <text x="14" y="74" fill="#0f172a" font-size="11">• Hiện số chưa đọc trên <tspan font-weight="700" fill="#dc2626">Badge chuông đỏ</tspan></text>
    <text x="14" y="94" fill="#0f172a" font-size="11">• Xem lịch sử tại <tspan class="code">/portal/notifications</tspan></text>
    <text x="14" y="116" fill="#2563eb" font-size="10" font-weight="600">➔ Nhấn vào tin để nhảy ngay đến hóa đơn/sự cố</text>
  </g>

  <!-- KÊNH 2: WEB PUSH NOTIFICATION (PWA) -->
  <g transform="translate(690, 290)">
    <rect width="260" height="150" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)" />
    <rect width="260" height="34" rx="12" fill="#faf5ff" />
    <rect y="22" width="260" height="12" fill="#faf5ff" />
    <text x="14" y="22" fill="#6b21a8" font-size="12" font-weight="700">📲 KÊNH 2: WEB PUSH (PWA ⭐ TV4)</text>

    <text x="14" y="54" fill="#0f172a" font-size="11">• Dùng chuẩn <tspan font-weight="700">W3C Push API &amp; VAPID</tspan></text>
    <text x="14" y="74" fill="#0f172a" font-size="11">• Service Worker (<tspan class="code">sw.js</tspan>) nhận nền</text>
    <text x="14" y="94" fill="#7e22ce" font-size="11" font-weight="700">• Bật pop-up kể cả khi TẮT TRÌNH DUYỆT</text>
    <text x="14" y="114" fill="#0f172a" font-size="10.5">• Rung và hiển thị trên màn hình khóa điện thoại</text>
    <text x="14" y="132" fill="#9333ea" font-size="10" font-weight="600">➔ Điểm nhấn công nghệ nâng cao khi bảo vệ</text>
  </g>

  <!-- KÊNH 3: REALTIME SOCKET.IO -->
  <g transform="translate(690, 475)">
    <rect width="260" height="135" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
    <rect width="260" height="34" rx="12" fill="#f0fdf4" />
    <rect y="22" width="260" height="12" fill="#f0fdf4" />
    <text x="14" y="22" fill="#166534" font-size="12" font-weight="700">⚡ KÊNH 3: REALTIME (SOCKET.IO)</text>

    <text x="14" y="54" fill="#0f172a" font-size="11">• Kết nối WebSocket cùng cổng API 4000</text>
    <text x="14" y="74" fill="#0f172a" font-size="11">• Room cá nhân hóa: <tspan class="code">user:{userId}</tspan></text>
    <text x="14" y="94" fill="#0f172a" font-size="11">• Bật Toast thông báo tức thời khi đang mở tab</text>
    <text x="14" y="116" fill="#15803d" font-size="10" font-weight="600">➔ Trải nghiệm mượt mà, không cần F5 tải lại</text>
  </g>

  <!-- FOOTER BANNER -->
  <g transform="translate(50, 630)">
    <rect width="900" height="34" rx="6" fill="#e2e8f0" />
    <text x="450" y="21" fill="#334155" font-size="11.5" text-anchor="middle">🎯 <tspan font-weight="700">Phân công:</tspan> TV4 thiết kế giao diện danh sách thông báo &amp; tích hợp Web Push; TV1 phối hợp cấu hình Socket.IO.</text>
  </g>
</svg>
